server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:backend/.env[.properties]
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gold_store}
    username: ${SPRING_DATASOURCE_USERNAME:gold_store}
    password: ${SPRING_DATASOURCE_PASSWORD:gold_store}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:2}
      pool-name: GoldStoreHikariPool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

application:
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-secret-before-development}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    seed:
      admin:
        username: ${AUTH_ADMIN_USERNAME:admin}
        password: ${AUTH_ADMIN_PASSWORD:admin123}
      staff:
        username: ${AUTH_STAFF_USERNAME:staff}
        password: ${AUTH_STAFF_PASSWORD:staff123}
