services:
  postgres:
    image: postgres:16-alpine
    container_name: gold-store-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gold_store}
      POSTGRES_USER: ${POSTGRES_USER:-gold_store}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gold_store}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gold-store-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gold_store} -d ${POSTGRES_DB:-gold_store}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gold-store-postgres-data:
